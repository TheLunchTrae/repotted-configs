owner_type: user
repository:
  default_branch: main
  is_template: false
  has_issues: false
  has_projects: false
  has_wiki: false
  has_discussions: false
  has_pull_requests: true
  pull_request_creation_policy: collaborators_only
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true
  web_commit_signoff_required: true
  immutable_releases: false
  pull_request_creation_cap:
    enabled: false
    max_open_pull_requests: 1
    include_drafts: false
merge:
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  merge_commit_title: PR_TITLE
  merge_commit_message: BLANK
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
actions:
  enabled: false
  sha_pinning_required: false
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
  approval_policy: first_time_contributors
  artifact_and_log_retention:
    days: 90
  oidc_customization_sub:
    use_default: true
    use_immutable_subject: true
security:
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
  vulnerability_alerts: false
  automated_security_fixes: false
  private_vulnerability_reporting: false
  code_scanning_default_setup:
    state: not-configured
    runner_type: standard
    runner_label: null
    query_suite: default
    threat_model: remote
pages:
  build_type: workflow
  https_enforced: true
rulesets:
  - name: Allow Merge
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: exempt
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: update
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          required_reviewers: []
          require_code_owner_review: true
          require_last_push_approval: true
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: false
          allowed_merge_methods:
            - squash
  - name: PR Requirements
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: false
          required_status_checks: []
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          required_reviewers: []
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - squash
      - type: deletion
      - type: creation
environments:
  - name: github-pages
    wait_timer: 0
    prevent_self_review: false
    reviewers: []
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies: true
    branch_policies:
      - name: main
        type: branch
labels:
  - name: accessibility
    color: f143ab
    description: Barrier affecting people with disabilities
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: e4e669
    description: This doesn't seem right
  - name: question
    color: d876e3
    description: Further information is requested
  - name: wontfix
    color: ffffff
    description: This will not be worked on
