owner_type: user
repository:
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true
  web_commit_signoff_required: true
merge:
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
actions:
  approval_policy: all_external_contributors
security:
  security_and_analysis:
    secret_scanning:
      status: enabled
    secret_scanning_push_protection:
      status: enabled
  vulnerability_alerts: true
  automated_security_fixes: true
  private_vulnerability_reporting: true
  code_scanning_default_setup:
    state: not-configured
    runner_type: standard
    runner_label: null
    query_suite: default
    threat_model: remote
  code_scanning_ai_scan:
    pr_scan: disabled
  dependabot_runner_settings:
    runner_type: standard
rulesets:
  - name: "Main: Block Creation and Deletion"
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: creation
      - type: deletion
  - name: "Main: Block Force Pushes"
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: non_fast_forward
  - name: "Main: Require Approval"
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: exempt
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: false
          required_reviewers: []
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - merge
            - squash
            - rebase
  - name: "Main: Require Code Owner Review"
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: exempt
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          required_reviewers: []
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - merge
            - squash
            - rebase
  - name: "Main: Require PR"
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          required_reviewers: []
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods:
            - squash
  - name: "Main: Require Status Checks"
    target: branch
    enforcement: active
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: exempt
    conditions:
      ref_name:
        exclude: []
        include:
          - ~DEFAULT_BRANCH
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: false
          required_status_checks:
            - context: quality
            - context: windows
  - name: "Tags: Restrict creation"
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude:
          - refs/tags/v*
        include:
          - ~ALL
    rules:
      - type: creation
  - name: "Tags: Restrict updates and deletion"
    target: tag
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        exclude: []
        include:
          - ~ALL
    rules:
      - type: update
      - type: deletion
      - type: non_fast_forward
